# makepad-wm-api — the Makepad apps' API to the window manager (wm).
#
# An app hosted as an wm tile talks to the compositor over the studio
# protocol's Custom channel; this crate is the typed vocabulary on both
# ends: "open a preview of this file", "open this file", "my title/cwd
# changed", "notify". Standalone (not hosted) the calls fall back sensibly.

[package]
name = "makepad-wm-api"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "makepad_wm_api"
path = "src/lib.rs"

# `gpusim` is `platform`'s own cfg for its simulated-GPU test backend
# (declared there by its build script); the Linux direct-mode standalone
# span helpers below gate on it the same way `platform::screens()` does,
# without a build script of this crate's own.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(gpusim)"] }

[dependencies]
makepad-widgets-core = { path = "../../widgets/core" }

# The registry turns a viewer's app id into its binary for the standalone
# sibling spawn (wasm has no processes to spawn).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
makepad-app-registry = { path = "../app_registry" }
